name: dbt CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (sqlfluff) — no warehouse needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: sqlfluff lint
        run: sqlfluff lint dbt/models --dialect snowflake --templater jinja || true
        # `|| true` while you're learning; remove it to make lint blocking.

  build:
    name: dbt build (Snowflake CI schema)
    runs-on: ubuntu-latest
    needs: lint
    # Runs only if Snowflake secrets are configured in the repo settings.
    if: ${{ github.actor != 'dependabot[bot]' }}
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      DBT_PROFILES_DIR: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Skip if no Snowflake secret
        id: guard
        run: |
          if [ -z "$SNOWFLAKE_ACCOUNT" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Snowflake secrets set — skipping dbt build."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: dbt build (continuous delivery gate)
        if: steps.guard.outputs.run == 'true'
        working-directory: dbt
        run: |
          cp profiles.example.yml profiles.yml
          dbt deps
          dbt build --target ci
